name: Deploy SIPL to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Prepare static output
        run: |
          if [ -d .output/public ]; then
            SITE_DIR=".output/public"
          elif [ -d dist/client ]; then
            SITE_DIR="dist/client"
          else
            echo "Não foi encontrada a pasta de saída estática do build."
            find . -maxdepth 3 -type f -name 'index.html' -print
            exit 1
          fi

          if [ ! -f "$SITE_DIR/index.html" ] && [ -f "$SITE_DIR/_shell.html" ]; then
            cp "$SITE_DIR/_shell.html" "$SITE_DIR/index.html"
          fi

          if [ ! -f "$SITE_DIR/index.html" ]; then
            echo "index.html não foi gerado em $SITE_DIR."
            find "$SITE_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          touch "$SITE_DIR/.nojekyll"
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
